# LUNOTE 로컬 개발 환경
# 사용법:
#   docker compose up -d      # 백그라운드로 전부 시작
#   docker compose ps         # 상태 확인
#   docker compose logs -f db # 특정 서비스 로그 보기
#   docker compose down       # 전부 중지 (데이터는 volume에 보존)
#   docker compose down -v    # 중지 + 데이터까지 삭제 (초기화)
#
# 프로덕션은 RDS/ElastiCache를 사용한다 — 이 파일은 로컬 전용.

services:
  db:
    image: postgres:16-alpine
    container_name: lunote-db
    environment:
      POSTGRES_USER: lunote
      POSTGRES_PASSWORD: lunote_local # 로컬 전용 비밀번호. 프로덕션은 Secrets Manager.
      POSTGRES_DB: lunote
    ports:
      - '5432:5432' # 호스트:컨테이너 — 맥의 5432 → 컨테이너의 5432
    volumes:
      - db-data:/var/lib/postgresql/data # 컨테이너를 지워도 데이터 유지
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lunote -d lunote']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lunote-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 호환 로컬 스토리지 — 프로덕션은 실제 S3 (env만 교체)
  minio:
    image: minio/minio:latest
    container_name: lunote-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: lunote
      MINIO_ROOT_PASSWORD: lunote_local # 로컬 전용
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 웹 콘솔 (http://localhost:9001)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # 시작 시 버킷 자동 생성 후 종료
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lunote lunote_local &&
      mc mb --ignore-existing local/lunote-attachments &&
      echo '버킷 준비 완료'
      "

volumes:
  db-data:
  minio-data:
