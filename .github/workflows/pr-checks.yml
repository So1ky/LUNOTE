name: PR 검사

# 배포 권한이 없는 검사 전용 워크플로 (배포는 Jenkins + ArgoCD — docs/ARCHITECTURE.md §9).
# fork PR의 코드를 실행하므로 pull_request_target과 시크릿을 쓰지 않는다.
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 서드파티 액션은 커밋 SHA로 고정한다 (태그는 변조될 수 있다).
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # prisma.config.ts가 DATABASE_URL을 요구한다. 접속하지 않으므로 형식만 맞춘 값 (실제 시크릿 아님)
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # package.json의 lint는 --fix가 붙어 있어 CI에서는 검사만 한다
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npx tsc --noEmit
      - run: npx jest

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npx tsc -b
