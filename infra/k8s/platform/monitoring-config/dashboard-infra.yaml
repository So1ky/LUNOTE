# 인프라 대시보드 — RDS(CloudWatch, Grafana IRSA 읽기 전용). 노드·K8s 리소스는 kps 기본 대시보드를 쓴다.
# 커뮤니티 대시보드(gnetId)는 넣지 않는다: 차트 init 컨테이너가 기동마다 grafana.com에서 받는데(`set -e` + `curl -f`) 받기 실패면 Grafana가 뜨지 않고(`-k`라 TLS 검증도 없음), 내용도 kps 기본과 겹친다(Plan 8 Task 7).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infra
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: LUNOTE
data:
  infra.json: |
    {
