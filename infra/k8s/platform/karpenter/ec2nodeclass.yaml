apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest # 코어 노드그룹과 동일 계열 (arm64는 NodePool requirements가 강제)
  role: lunote-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: lunote # 프라이빗 서브넷 (Plan 1에서 태그 선반영)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: lunote # node SG(클러스터 통신) + app SG(RDS/Redis 인그레스) 둘 다 매칭
  metadataOptions:
    httpTokens: required # IMDSv2 강제
  kubelet:
    # vpc-cni prefix delegation이라 IP는 충분 — 지정하지 않으면 ENI 기준 기본값(medium 8개)이라 DaemonSet이 못 뜬다.
    # 110이 아닌 이유: kube-reserved 메모리가 11×maxPods+255Mi로 늘어 2Gi 노드(c6gn.medium)에 과하다
    maxPods: 20
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
