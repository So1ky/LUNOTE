# CI(Jenkins) 네임스페이스 + Secrets Manager 읽기 경로 + 빌드 에이전트 SA.
# 가드레일(ResourceQuota/LimitRange/NetworkPolicy)은 jenkins-guardrails.yaml.
# Jenkins 자체는 infra/k8s/apps/jenkins.yaml(차트) — 여기는 차트가 만들지 않는 것만 둔다.
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
# ESO가 이 SA의 토큰으로 lunote-eso-jenkins 롤을 맡는다 (lunote/shared/jenkins 읽기 전용)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: jenkins
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::695019457880:role/lunote-eso-jenkins
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: jenkins
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-reader
---
# 관리자 계정, GitHub deploy key, 웹훅 서명 검증용 시크릿. 키 이름은 차트 기본값(jenkins-admin-user/-password)에 맞춘다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-secrets
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: jenkins-secrets
    template:
      data:
        jenkins-admin-user: admin
        jenkins-admin-password: "{{ .adminPassword }}"
        deploy-key: "{{ .deployKey }}"
        webhook-secret: "{{ .webhookSecret }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: lunote/shared/jenkins
        property: admin-password
    - secretKey: deployKey
      remoteRef:
        key: lunote/shared/jenkins
        property: deploy-key
    - secretKey: webhookSecret
      remoteRef:
        key: lunote/shared/jenkins
        property: webhook-secret
---
# 빌드 Pod가 쓰는 SA — lunote-jenkins-agent 롤(lunote/api ECR push만). 컨트롤러 SA에는 AWS 권한이 없다.
# K8s API 토큰은 마운트하지 않는다(빌드는 K8s API를 쓰지 않는다). IRSA 토큰은 별도 투영이라 영향 없음.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::695019457880:role/lunote-jenkins-agent
automountServiceAccountToken: false
