# prod 관리자 웹의 Service. API와 같은 이유로 워크로드 디렉터리가 아니라 여기 둔다 — apps/project-prod-api.yaml 허용 목록은
# 네임스페이스 안에서 끝나는 종류로 한정한다.
apiVersion: v1
kind: Service
metadata:
  name: admin-web
  namespace: prod
  labels:
    app.kubernetes.io/part-of: admin-web
spec:
  selector:
    app.kubernetes.io/name: admin-web
  ports:
    - name: http
      port: 80
      targetPort: http
