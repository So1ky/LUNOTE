# prod 환경 네임스페이스 + Secrets Manager 읽기 경로.
# ResourceQuota/LimitRange/NetworkPolicy는 Phase 3-4에서 추가한다.
apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
# ESO가 이 SA의 토큰으로 lunote-eso-prod 롤을 맡는다 (lunote/prod/* + lunote/shared/redis 읽기 전용)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::695019457880:role/lunote-eso-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-reader
