# prod 환경 네임스페이스 + Secrets Manager 읽기 경로.
# 가드레일(ResourceQuota/LimitRange/NetworkPolicy)은 prod-guardrails.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    # ALB 타깃 등록이 끝나야 파드가 Ready — 롤링 업데이트 중 502 방지
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
# ESO가 이 SA의 토큰으로 lunote-eso-prod 롤을 맡는다 (lunote/prod/* + lunote/shared/redis 읽기 전용)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-reader
  namespace: prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::695019457880:role/lunote-eso-prod
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-reader
