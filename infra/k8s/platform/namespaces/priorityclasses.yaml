# 자원이 부족할 때 prod 파드가 staging 파드를 밀어낸다 (스펙 §2 격리 장치).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lunote-prod
value: 1000
globalDefault: false
description: prod 워크로드
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lunote-staging
value: 100
globalDefault: false
description: staging 워크로드
