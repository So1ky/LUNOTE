# staging 전용 Redis (BullMQ 큐 + rate limit 카운터). ElastiCache는 prod 전용이다 — 같은 인스턴스를 논리 DB 번호로만
# 나누면 staging이 prod 큐에 접속할 수 있다(번호는 접속하는 쪽이 고른다).
# 비영속: Pod가 재시작되면 큐와 카운터가 비워진다(staging이라 수용). 인증 없음 — NetworkPolicy로 api Pod만 접속.
# 워크로드 오버레이가 아니라 여기 두는 이유: Service는 배포 저장소(CI 키)에서 만들 수 없는 종류다(apps/project-staging-api.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: staging
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        karpenter.sh/nodepool: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # prod ElastiCache(7.1)와 같은 7.x
          image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
          # 디스크에 쓰지 않는다. BullMQ는 noeviction이 필수다(키가 조용히 지워지면 잡이 사라진다)
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: staging
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# 네임스페이스는 기본 거부다. Redis로 들어오는 것은 api(마이그레이션 Job 포함) Pod뿐, 나가는 것은 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: api
      ports:
        - protocol: TCP
          port: 6379
