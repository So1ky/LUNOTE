# 로그 수집기 — K8s API로 Pod 로그를 받아 Loki로 보낸다(Deployment 1개). Task 9에서 OTLP→Tempo 추가.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/infra/k8s/platform/alloy/values.yaml
    - repoURL: https://github.com/So1ky/LUNOTE.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
