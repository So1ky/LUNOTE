# AWS Load Balancer Controller. IRSA 롤·정책은 infra/terraform/envs/prod/lbc.tf.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.5.0
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/infra/k8s/platform/aws-load-balancer-controller/values.yaml
    - repoURL: https://github.com/So1ky/LUNOTE.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # 차트가 렌더링할 때마다 웹훅 인증서를 새로 만든다 — 무시하지 않으면 영원히 OutOfSync이고
  # sync마다 인증서가 교체돼 웹훅이 잠시 실패한다.
  ignoreDifferences:
    - kind: Secret
      name: aws-load-balancer-tls
      namespace: kube-system
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true # 위 필드는 sync 때도 덮어쓰지 않는다
