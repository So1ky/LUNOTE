# api-staging 전용 프로젝트. 이 앱의 소스(배포 저장소)는 CI의 deploy key로 쓸 수 있으므로,
# 거기에 무엇이 들어오든 staging 네임스페이스의 아래 종류만 만들 수 있게 묶는다.
# 종류만 막는다 — Pod의 내용은 네임스페이스의 Pod Security(restricted)가 막는다(platform/namespaces/staging.yaml).
# Service와 Ingress는 일부러 뺐다(externalIPs·NLB·공유 ALB로 네임스페이스 밖에 닿는다) —
# platform/namespaces/staging-api-service.yaml, staging-api-ingress.yaml.
# 종류를 늘릴 때는 workloads/api 오버레이가 실제로 만드는 것만: kubectl kustomize <overlay> | grep kind
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: staging-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # 이 프로젝트를 쓰는 Application보다 먼저
spec:
  description: staging API 워크로드 — deploy key가 닿는 범위의 한계
  sourceRepos:
    - https://github.com/So1ky/lunote-deploy.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: staging
  clusterResourceWhitelist: [] # 클러스터 범위 리소스 금지 (Namespace, ClusterRole 등)
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: external-secrets.io
      kind: ExternalSecret
    # 아래 둘은 git에 없는 자식 리소스(Deployment·Job이 만든다) — 허용 목록에 없으면 ArgoCD UI 트리에서 숨겨진다. 동기화 대상은 아니다.
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
