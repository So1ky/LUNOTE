# 수집 대상·알림 규칙·대시보드(ConfigMap) — 차트 values와 분리해 규칙 변경 diff가 읽히게 한다. CRD는 kube-prometheus-stack이 만든다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/So1ky/LUNOTE.git
    targetRevision: develop
    path: infra/k8s/platform/monitoring-config
    directory:
      exclude: "tests/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true # 규칙·대시보드 파일 삭제 = 리소스 삭제가 자연스럽다(워크로드 앱과 같은 선택)
    syncOptions:
      - SkipDryRunOnMissingResource=true # 재해복구 시 kps CRD보다 먼저 sync돼도 실패하지 않게
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
