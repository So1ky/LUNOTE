# staging API 워크로드. 이미지 태그는 workloads/api/overlays/staging/kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/So1ky/LUNOTE.git
    targetRevision: develop
    path: infra/k8s/workloads/api/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      selfHeal: true
      prune: true # 설정 변경마다 생기는 해시 ConfigMap의 이전 버전을 정리한다
