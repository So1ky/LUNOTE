# prod 관리자 웹 — 환경이 하나뿐이라 base/overlay 없이 평면. 이미지 태그는 scripts/admin-web-release.sh가 바꾸고 사람이 PR한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - deployment.yaml
  - networkpolicy.yaml
images:
  - name: lunote-admin-web
    newName: 695019457880.dkr.ecr.ap-northeast-2.amazonaws.com/lunote/admin-web
    newTag: "7ac658fdab43" # scripts/admin-web-release.sh가 push한 git SHA — 사람이 PR로 배포
