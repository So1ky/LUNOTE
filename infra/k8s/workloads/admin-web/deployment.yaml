# 관리자 웹(Vite SPA) — Caddy가 정적 파일만 서빙한다. API 호출은 브라우저가 공개 api.lunoteapp.com으로 직접(빌드 시 VITE_API_URL).
# tailnet에서만 열린다: Service·Ingress는 platform/namespaces/prod-admin-web-{service,ingress}.yaml.
# replicas 1 — 내부 도구. Spot 회수 시 Karpenter가 다시 띄울 때까지 수 분 중단을 수용한다(설계 §6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-web
  labels:
    app.kubernetes.io/part-of: admin-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-web
        app.kubernetes.io/part-of: admin-web
    spec:
      automountServiceAccountToken: false # API를 호출하지 않는다
      nodeSelector:
        karpenter.sh/nodepool: default # 어드미션 정책 필수(platform/namespaces/admission-policies.yaml)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: lunote-admin-web # kustomization의 images가 ECR 주소와 git SHA 태그로 치환
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # Caddy XDG_DATA_HOME·XDG_CONFIG_HOME(이미지 ENV)
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
