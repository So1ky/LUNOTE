apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - externalsecret.yaml
images:
  - name: lunote-api
    newName: 695019457880.dkr.ecr.ap-northeast-2.amazonaws.com/lunote/api
    newTag: cd4a5ecffc67 # 자리표시 — 실제 배포 태그는 배포 저장소(So1ky/lunote-deploy)의 이 줄이다(CI가 갱신)
configMapGenerator:
  - name: api-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
    literals:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=info
      - S3_BUCKET=lunote-attachments-staging-695019457880
      - S3_REGION=ap-northeast-2
      - CORS_ORIGINS=https://admin-staging.lunoteapp.com
      - SMTP_HOST=smtp-relay.brevo.com
      - SMTP_PORT=587
      # Sentry 이벤트의 environment(NODE_ENV는 staging·prod 모두 production). DSN은 시크릿 lunote/staging/app
      - SENTRY_ENVIRONMENT=staging
      # OpenTelemetry(Plan 8). 트레이스: 앱 → Alloy(OTLP 4317) → Tempo, 부모 기반 20% 샘플링
      - OTEL_SERVICE_NAME=lunote-api
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=staging
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.monitoring.svc:4317
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.2
      - REDIS_URL=redis://redis:6379 # staging 전용 클러스터 내 Redis(platform/namespaces/staging-redis.yaml) — 비밀이 아니다
patches:
  - target:
      kind: ServiceAccount
      name: api
    patch: |-
      - op: add
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::695019457880:role/lunote-api-staging
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: lunote-staging
