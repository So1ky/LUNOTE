# lunote/staging/app의 모든 키를 그대로 주입한다. REDIS_URL은 시크릿이 아니라 설정값이다(kustomization.yaml) —
# staging은 ElastiCache를 쓰지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: api-secrets
  dataFrom:
    - extract:
        key: lunote/staging/app
