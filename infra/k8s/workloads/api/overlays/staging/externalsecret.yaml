# lunote/staging/app의 모든 키를 그대로 주입하고, 공용 Redis 주소에는 staging 논리 DB(/1)를 붙인다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: api-secrets
    template:
      mergePolicy: Merge
      data:
        REDIS_URL: "{{ .REDIS_BASE_URL }}/1"
  dataFrom:
    - extract:
        key: lunote/staging/app
  data:
    - secretKey: REDIS_BASE_URL
      remoteRef:
        key: lunote/shared/redis
        property: REDIS_URL
