# NestJS API. BullMQ 워커(관리자 이메일)도 같은 프로세스에서 돈다 (ARCHITECTURE §12 — 분리는 큐 부하가 생기면).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      serviceAccountName: api
      # RDS/Redis 인그레스는 lunote-app SG를 참조한다 — 그 SG는 Karpenter 노드에만 붙는다
      nodeSelector:
        karpenter.sh/nodepool: default
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: lunote-api # overlay의 images가 ECR 주소와 git SHA 태그로 치환
          ports:
            - name: http
              containerPort: 3000
          env:
            # node-postgres는 sslmode=require를 인증서 검증까지 수행한다. RDS CA는 Node 기본 신뢰 목록에
            # 없으므로 추가로 신뢰시킨다 (검증을 끄지 않는다).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/rds-ca/rds-ca-ap-northeast-2.crt
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # DB가 죽으면 트래픽만 뺀다 (/health 503)
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          # 프로세스 생존만 본다 — DB 장애로 파드를 재시작하면 복구가 늦어질 뿐이다
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          lifecycle:
            # ALB가 타깃을 빼는 동안 기존 연결을 계속 받는다
            preStop:
              sleep:
                seconds: 15
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rds-ca
          configMap:
            name: rds-ca
