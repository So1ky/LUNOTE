# API 빌드 에이전트 Pod — Jenkinsfile이 빌드마다 하나 띄우고 끝나면 지운다.
# 모든 컨테이너가 작업 폴더(/home/jenkins/agent)와 localhost를 공유한다. 외부 코드(npm 의존성, Dockerfile RUN)가
# 도는 Pod이므로 deploy key는 여기로 내려보내지 않는다(Jenkinsfile의 태그 커밋 단계는 별도 Pod).
# 이미지는 태그가 아니라 다이제스트(@sha256)로 고정한다 — 태그는 배포자가 다른 내용으로 바꿀 수 있고(2026-03 Trivy
# 공급망 사고), 이 Pod의 컨테이너는 ECR push 권한을 갖는다. 버전을 올릴 때는 다이제스트도 함께 바꾼다:
#   docker buildx imagetools inspect <이미지:태그> --format '{{.Manifest.Digest}}'
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/component: jenkins-agent # NetworkPolicy jenkins-agent가 고른다
  annotations:
    karpenter.sh/do-not-disrupt: "true" # 빌드 중 노드 통합으로 Pod가 옮겨지지 않게
    # AWS 권한(IRSA)은 aws 컨테이너에만 넣는다 — npm·테스트·Dockerfile RUN이 도는 컨테이너는 ECR 권한이 없다
    eks.amazonaws.com/skip-containers: jnlp,node,postgres,redis,s3mock,mailpit,buildkit,trivy
spec:
  serviceAccountName: jenkins-agent # IRSA — lunote/api ECR push만 (위 주석으로 aws 컨테이너에만 주입)
  nodeSelector:
    karpenter.sh/nodepool: default
  securityContext:
    fsGroup: 1000
  containers:
    # Jenkins 컨트롤러와 통신 + git 작업
    - name: jnlp
      image: jenkins/inbound-agent:3391.va_37fa_a_305d6d-4-jdk21@sha256:c5d50ca09a7de45999983c69e0527499ca667efe00a85cf1ce5ed968b5b21719
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    # lint · 단위 테스트 · e2e
    - name: node
      image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      env:
        # 아래 사이드카를 가리키는 CI 전용 값 (apps/api/.env.example과 같은 형태, 실제 시크릿 아님)
        - name: DATABASE_URL
          value: postgresql://lunote:lunote_ci@localhost:5432/lunote?schema=public
        - name: REDIS_URL
          value: redis://localhost:6379
        - name: JWT_SECRET
          value: ci-dummy-jwt-value
        - name: S3_ENDPOINT
          value: http://localhost:9090
        - name: S3_REGION
          value: us-east-1
        - name: S3_BUCKET
          value: lunote-attachments
        - name: S3_ACCESS_KEY
          value: lunote
        - name: S3_SECRET_KEY
          value: ci-dummy
        - name: SMTP_HOST
          value: localhost
        - name: SMTP_PORT
          value: "1025"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 3Gi
    # --- e2e 의존 서비스 (로컬 docker-compose.yml과 같은 역할) ---
    - name: postgres
      image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      env:
        - name: POSTGRES_USER
          value: lunote
        - name: POSTGRES_PASSWORD
          value: lunote_ci
        - name: POSTGRES_DB
          value: lunote
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    - name: redis
      image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    # S3 호환 저장소 — MinIO 공개 이미지가 더 배포되지 않아 CI는 S3Mock을 쓴다
    - name: s3mock
      image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
      env:
        - name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS
          value: lunote-attachments
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 768Mi
    - name: mailpit
      image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
    # --- 이미지 빌드·스캔·push ---
    # 특권 없이 동작하는 빌더. seccomp/AppArmor만 풀어 준다(사용자 네임스페이스 생성에 필요).
    - name: buildkit
      image: moby/buildkit:v0.33.1-rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
      args: ["--oci-worker-no-process-sandbox"]
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
        runAsUser: 1000
        runAsGroup: 1000
      env:
        - name: DOCKER_CONFIG
          value: /docker-config
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      volumeMounts:
        - name: buildkit
          mountPath: /home/user/.local/share/buildkit
        - name: docker-config
          mountPath: /docker-config
    - name: trivy
      image: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      env:
        - name: HOME
          value: /tmp
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # ECR 로그인 토큰 발급(IRSA)과 이미지 존재 확인
    - name: aws
      image: public.ecr.aws/aws-cli/aws-cli:2.37.9@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      env:
        - name: HOME
          value: /tmp
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: docker-config
          mountPath: /docker-config
  volumes:
    - name: buildkit
      emptyDir: {}
    # ECR 토큰(12시간 유효)은 디스크가 아니라 메모리에만 둔다
    - name: docker-config
      emptyDir:
        medium: Memory
