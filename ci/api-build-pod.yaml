# API 빌드 에이전트 Pod — Jenkinsfile이 빌드마다 하나 띄우고 끝나면 지운다.
# 모든 컨테이너가 작업 폴더(/home/jenkins/agent)와 localhost를 공유한다.
apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/component: jenkins-agent # NetworkPolicy jenkins-agent가 고른다
  annotations:
    karpenter.sh/do-not-disrupt: "true" # 빌드 중 노드 통합으로 Pod가 옮겨지지 않게
spec:
  serviceAccountName: jenkins-agent # IRSA — lunote/api ECR push만
  nodeSelector:
    karpenter.sh/nodepool: default
  securityContext:
    fsGroup: 1000
  containers:
    # Jenkins 컨트롤러와 통신 + git 작업
    - name: jnlp
      image: jenkins/inbound-agent:3391.va_37fa_a_305d6d-4-jdk21
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    # lint · 단위 테스트 · e2e
    - name: node
      image: node:22.23.3-alpine
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      env:
        # 아래 사이드카를 가리키는 CI 전용 값 (apps/api/.env.example과 같은 형태, 실제 시크릿 아님)
        - name: DATABASE_URL
          value: postgresql://lunote:lunote_ci@localhost:5432/lunote?schema=public
        - name: REDIS_URL
          value: redis://localhost:6379
        - name: JWT_SECRET
          value: ci-dummy-jwt-value
        - name: S3_ENDPOINT
          value: http://localhost:9090
        - name: S3_REGION
          value: us-east-1
        - name: S3_BUCKET
          value: lunote-attachments
        - name: S3_ACCESS_KEY
          value: lunote
        - name: S3_SECRET_KEY
          value: ci-dummy
        - name: SMTP_HOST
          value: localhost
        - name: SMTP_PORT
          value: "1025"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 3Gi
    # --- e2e 의존 서비스 (로컬 docker-compose.yml과 같은 역할) ---
    - name: postgres
      image: postgres:16-alpine
      env:
        - name: POSTGRES_USER
          value: lunote
        - name: POSTGRES_PASSWORD
          value: lunote_ci
        - name: POSTGRES_DB
          value: lunote
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
    - name: redis
      image: redis:7-alpine
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    # S3 호환 저장소 — MinIO 공개 이미지가 더 배포되지 않아 CI는 S3Mock을 쓴다
    - name: s3mock
      image: adobe/s3mock:5.2.3
      env:
        - name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS
          value: lunote-attachments
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 768Mi
    - name: mailpit
      image: axllent/mailpit:v1.31.4
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
    # --- 이미지 빌드·스캔·push ---
    # 특권 없이 동작하는 빌더. seccomp/AppArmor만 풀어 준다(사용자 네임스페이스 생성에 필요).
    - name: buildkit
      image: moby/buildkit:v0.33.1-rootless
      args: ["--oci-worker-no-process-sandbox"]
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
        runAsUser: 1000
        runAsGroup: 1000
      env:
        - name: DOCKER_CONFIG
          value: /docker-config
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      volumeMounts:
        - name: buildkit
          mountPath: /home/user/.local/share/buildkit
        - name: docker-config
          mountPath: /docker-config
    - name: trivy
      image: aquasec/trivy:0.75.0
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      env:
        - name: HOME
          value: /tmp
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
    # ECR 로그인 토큰 발급(IRSA)과 이미지 존재 확인
    - name: aws
      image: public.ecr.aws/aws-cli/aws-cli:2.37.9
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      env:
        - name: HOME
          value: /tmp
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: docker-config
          mountPath: /docker-config
  volumes:
    - name: buildkit
      emptyDir: {}
    # ECR 토큰(12시간 유효)은 디스크가 아니라 메모리에만 둔다
    - name: docker-config
      emptyDir:
        medium: Memory
